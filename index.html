<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel TV v2</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#101418;color:#fff}.panel{max-width:1000px;margin:25px auto;padding:24px;background:#1b2229;border-radius:14px}input,select,button{padding:11px;border-radius:8px;border:1px solid #3a4652}input,select{background:#0f1419;color:#fff}button{background:#2e7d32;color:#fff;cursor:pointer;border:0}.secondary{background:#37474f}.item{border:1px solid #35414d;padding:12px;border-radius:10px;margin:10px 0}.row{display:grid;grid-template-columns:150px 1fr 90px 110px 80px;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.small{color:#b8c2cc;font-size:13px}#viewer{display:none;position:fixed;inset:0;background:#000}#screen,#img,#video{width:100%;height:100%;border:0;display:none}#img{object-fit:contain}.exit{position:fixed;right:10px;top:10px;z-index:5;opacity:.1}@media(max-width:800px){.row{grid-template-columns:1fr 1fr}}</style></head><body>
<div id="config" class="panel"><h1>📺 Painel de TV — v2</h1><p class="small">O link da TV é fixo. Você altera a programação aqui e salva; a TV atualiza automaticamente.</p><div id="status">Aguardando login...</div>
<div id="login"><input id="pin" type="password" placeholder="PIN"><button onclick="login()">Entrar</button></div>
<div id="admin" style="display:none"><div id="items"></div><div class="actions"><button onclick="add()">＋ Adicionar</button><button onclick="save()">💾 Salvar</button><button class="secondary" onclick="load()">↻ Recarregar</button><button class="secondary" onclick="copyTV()">🔗 Copiar link da TV</button><button class="secondary" onclick="openTV()">📺 Abrir TV</button></div></div></div>
<div id="viewer"><button class="exit" onclick="location.href=location.pathname">⚙</button><iframe id="screen" allow="autoplay;fullscreen"></iframe><img id="img"><video id="video" autoplay muted playsinline></video></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL_SB="https://wbejpcbuktfwprlxqjth.supabase.co",KEY="sb_publishable_5xajQWM2gMkKPLBLvKN2Hw_uauZ1pBm",PIN="Luc@s1210";let db,items=[],i=0,timer;
const ok=()=>!URL_SB.startsWith("COLE_")&&!KEY.startsWith("COLE_");const stat=x=>document.getElementById("status").textContent=x;
function login(){if(document.getElementById("pin").value!==PIN)return alert("PIN incorreto");document.getElementById("login").style.display="none";document.getElementById("admin").style.display="block";load()}
function add(x={type:"url",name:"Novo item",url:"",seconds:30,active:true}){items.push(x);render()}
function esc(x){return String(x||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function render(){let itemsBox=document.getElementById("items");itemsBox.innerHTML="";items.forEach((x,n)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="row"><input value="${esc(x.name)}" onchange="items[${n}].name=this.value" placeholder="Nome"><input value="${esc(x.url)}" onchange="items[${n}].url=this.value" placeholder="URL"><input type="number" min="1" value="${x.seconds||30}" onchange="items[${n}].seconds=+this.value"><select onchange="items[${n}].type=this.value"><option value="url" ${x.type=="url"?"selected":""}>Dashboard</option><option value="image" ${x.type=="image"?"selected":""}>Imagem</option><option value="video" ${x.type=="video"?"selected":""}>Vídeo</option></select><button onclick="items.splice(${n},1);render()">Excluir</button></div><p class="small">Item ${n+1} • ${x.seconds||30}s</p><button class="secondary" onclick="move(${n},-1)">↑</button> <button class="secondary" onclick="move(${n},1)">↓</button> <button class="secondary" onclick="items[${n}].active=items[${n}].active===false;render()">Ativar/Desativar</button>`;itemsBox.appendChild(d)})}
function move(n,d){let j=n+d;if(j<0||j>=items.length)return;[items[n],items[j]]=[items[j],items[n]];render()}
async function load(){if(!ok())return stat("⚠️ Preencha URL e KEY do Supabase no código.");db=db||supabase.createClient(URL_SB,KEY);let r=await db.from("tv_playlist").select("items,updated_at").eq("id",1).maybeSingle();if(r.error)return stat(r.error.message);items=r.data?.items||[];render();stat("✅ Carregado: "+(r.data?.updated_at||""))}
async function save(){if(!ok())return alert("Configure o Supabase.");let r=await db.from("tv_playlist").upsert({id:1,items,updated_at:new Date().toISOString()});if(r.error)alert(r.error.message);else stat("✅ Salvo. A TV atualizará em até 30 segundos.")}
function copyTV(){navigator.clipboard.writeText(location.href.split("?")[0]+"?tv=1");alert("Link fixo copiado!")}
function openTV(){open(location.href.split("?")[0]+"?tv=1","_blank")}
async function start(){if(!ok())return;db=supabase.createClient(URL_SB,KEY);document.getElementById("config").style.display="none";document.getElementById("viewer").style.display="block";await refresh();setInterval(refresh,30000)}
async function refresh(){let r=await db.from("tv_playlist").select("items").eq("id",1).maybeSingle();if(r.data){let s=JSON.stringify(r.data.items||[]);if(s!==JSON.stringify(items)){items=r.data.items||[];i=0;show()}else if(!timer)show()}}
function show(){clearTimeout(timer);let a=items.filter(x=>x.active!==false&&x.url);if(!a.length)return;if(i>=a.length)i=0;let x=a[i];let screen=document.getElementById("screen"),img=document.getElementById("img"),video=document.getElementById("video");screen.style.display=img.style.display=video.style.display="none";if(x.type=="image"){img.src=x.url;img.style.display="block"}else if(x.type=="video"){video.src=x.url;video.style.display="block";video.play().catch(()=>{})}else{screen.src=x.url;screen.style.display="block"}timer=setTimeout(()=>{i=(i+1)%a.length;show()},Math.max(1,x.seconds||30)*1000)}
if(ok())stat("Ready / Digite o PIN");
render();if(new URLSearchParams(location.search).get("tv")=="1")start();
</script></body></html>
